name: Build & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows: build NSIS installer — creates the GitHub Release ─────────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  # ── Windows: build Portable exe — uploads after release exists ─────────────────
  build-windows-portable:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build Windows Portable
        run: npx electron-builder --win portable --publish never

      - name: Upload Portable exe to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -e "console.log('v' + require('./package.json').version)"
          $exe = Get-ChildItem release -Filter "*.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1
          if (-not $exe) { Write-Host "No portable exe found, skipping."; exit 0 }
          # GitHub's release API occasionally returns a transient 401 right after
          # the release is created by the build-windows job. Retry with backoff.
          $ok = $false
          foreach ($attempt in 1..6) {
            Write-Host "Upload attempt $attempt for $($exe.Name) -> $version"
            gh release upload $version $exe.FullName --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            $wait = [math]::Pow(2, $attempt)
            Write-Host "Upload failed (exit $LASTEXITCODE). Retrying in $wait s..."
            Start-Sleep -Seconds $wait
          }
          if (-not $ok) { Write-Error "Portable upload failed after retries"; exit 1 }

  # ── macOS: build DMG — uploads after release exists ──────────────────────
  build-mac:
    needs: build-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: CXXFLAGS="-std=c++20" npx @electron/rebuild -f -w better-sqlite3

      - name: Create app icons
        run: bash create-icon.sh

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build macOS arm64 DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish always

      - name: Build macOS x64 DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --x64 --publish always
