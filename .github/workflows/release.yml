name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Windows: build NSIS installer — creates the GitHub Release ───────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  # ── Windows: build Portable exe — uploads after release exists ───────────
  build-windows-portable:
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build Windows Portable
        run: npx electron-builder --win portable --publish never

      - name: Upload Portable exe to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter "*.exe" | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1
          if ($exe) { gh release upload "${{ github.ref_name }}" $exe.FullName --clobber }

  # ── macOS: build DMG — uploads after release exists ──────────────────────
  build-mac:
    needs: build-windows
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install root dependencies
        run: npm install --ignore-scripts

      - name: Rebuild better-sqlite3 for Electron
        run: CXXFLAGS="-std=c++20" npx @electron/rebuild -f -w better-sqlite3

      - name: Create app icons
        run: bash create-icon.sh

      - name: Build UI
        run: cd src-ui && npm install && npm run build

      - name: Build TypeScript
        run: npm run build

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --publish always
