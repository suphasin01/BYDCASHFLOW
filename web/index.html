<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalBiz — ระบบเอกสารธุรกิจ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0f1e;--surface:#111827;--surface2:#1a2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#f0f4ff;--muted:#8892a4;--muted2:#6b7685;
  --accent:#7c6df3;--accent-g:linear-gradient(135deg,#7c6df3,#a855f7);
  --green:#22d3a0;--green-g:linear-gradient(135deg,#22d3a0,#059669);
  --red:#f87171;--amber:#fbbf24;--blue:#60a5fa;
  --sidebar-w:240px;--topbar-h:60px;--radius:12px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased}
body.lang-zh{font-family:'Noto Sans SC','Inter',system-ui,sans-serif}
#sidebar{width:var(--sidebar-w);background:var(--surface);display:flex;flex-direction:column;border-right:1px solid var(--border);flex-shrink:0}
.logo{padding:20px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-icon{width:34px;height:34px;border-radius:9px;background:var(--accent-g);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--muted);margin-top:1px}
#nav{flex:1;padding:12px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:9px;color:var(--muted);text-decoration:none;cursor:pointer;transition:all .18s;font-size:13px;font-weight:500}
#nav a .icon{font-size:17px;opacity:.8;flex-shrink:0}
#nav a:hover{background:rgba(255,255,255,.05);color:var(--text)}
#nav a.active{background:rgba(124,109,243,.15);color:#a78bfa}
#nav a.active .icon{opacity:1}
.nav-section{font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.8px;text-transform:uppercase;padding:12px 12px 4px;margin-top:4px}
.company-switcher{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.company-switcher:hover{background:rgba(255,255,255,.04)}
.company-switcher-inner{display:flex;align-items:center;gap:10px}
.company-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.company-info{flex:1;min-width:0}
.company-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.company-sub{font-size:10px;color:var(--muted);margin-top:1px}
.company-caret{font-size:10px;color:var(--muted2);flex-shrink:0}
.sidebar-footer{padding:12px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:99px;padding:5px 10px;font-size:11px;color:var(--muted);flex:1}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 8px rgba(34,211,160,.6)}
.dot.off{background:var(--red);box-shadow:0 0 8px rgba(248,113,113,.5)}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:var(--topbar-h);padding:0 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
#topbar h1{font-size:15px;font-weight:600;color:var(--text)}
.topbar-right{display:flex;align-items:center;gap:10px}
#content{flex:1;overflow-y:auto;padding:28px;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(124,109,243,.06),transparent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent-g);color:#fff;box-shadow:0 4px 14px rgba(124,109,243,.35)}
.btn-primary:hover{box-shadow:0 4px 20px rgba(124,109,243,.5);opacity:.92}
.btn-success{background:var(--green-g);color:#fff}
.btn-danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.btn-danger:hover{background:rgba(248,113,113,.25)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid var(--border2)}
.btn-ghost:hover{background:rgba(255,255,255,.08);color:var(--text)}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px}
.btn-icon{padding:8px;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:80px;height:80px;border-radius:50%;opacity:.07;transform:translate(30px,-30px)}
.stat-card.green::before{background:var(--green)}.stat-card.red::before{background:var(--red)}.stat-card.amber::before{background:var(--amber)}.stat-card.blue::before{background:var(--blue)}
.stat-label{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.stat-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px}
.stat-value{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid var(--border)}
th{padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:rgba(255,255,255,.025)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:500}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;flex-shrink:0}
.badge-draft{background:rgba(139,148,158,.12);color:#8b949e}.badge-draft::before{background:#8b949e}
.badge-sent{background:rgba(96,165,250,.12);color:var(--blue)}.badge-sent::before{background:var(--blue)}
.badge-approved{background:rgba(34,211,160,.12);color:var(--green)}.badge-approved::before{background:var(--green)}
.badge-paid{background:rgba(34,211,160,.18);color:#6ee7b7}.badge-paid::before{background:#6ee7b7}
.badge-cancelled{background:rgba(248,113,113,.12);color:var(--red)}.badge-cancelled::before{background:var(--red)}
.badge-customer{background:rgba(124,109,243,.12);color:#a78bfa}.badge-customer::before{background:#a78bfa}
.badge-vendor{background:rgba(251,191,36,.12);color:var(--amber)}.badge-vendor::before{background:var(--amber)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:0;width:560px;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .18s;box-shadow:0 24px 60px rgba(0,0,0,.5)}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h2{font-size:15px;font-weight:600}
.modal-body{padding:20px 24px;overflow-y:auto;flex:1}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.form-group{margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:rgba(124,109,243,.6);background:rgba(124,109,243,.05)}
select option{background:var(--surface2)}
textarea{resize:vertical;min-height:64px;line-height:1.5}
.search-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.search-wrap input{max-width:280px}
.filter-bar{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.filter-bar select{width:auto;min-width:130px}
.items-list{display:flex;flex-direction:column;gap:6px}
.item-row{display:grid;grid-template-columns:1fr 64px 56px 100px 90px 32px;gap:6px;align-items:center}
.item-row-head{display:grid;grid-template-columns:1fr 64px 56px 100px 90px 32px;gap:6px;margin-bottom:4px;padding:0 2px}
.item-row-head span{font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.item-row input{padding:7px 8px;font-size:12px}
.item-amount{font-size:13px;color:var(--text);text-align:right;padding:0 4px}
.totals-box{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-top:8px}
.totals-box .row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.totals-box .row.total-row{border-top:1px solid var(--border);margin-top:6px;padding-top:10px;font-size:16px;font-weight:700;color:var(--text)}
.totals-box .row .label-t{color:var(--muted)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);text-align:center}
.empty-state .empty-icon{font-size:40px;margin-bottom:14px;opacity:.4;filter:grayscale(1)}
.empty-state p{font-size:13px;margin-top:4px;line-height:1.5}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.sec-hdr h2{font-size:15px;font-weight:600}
#toast{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.t-item{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:8px;max-width:320px;animation:slideUp .2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.t-item.ok{border-color:rgba(34,211,160,.3);color:var(--green)}
.t-item.err{border-color:rgba(248,113,113,.3);color:var(--red)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18)}
.divider{height:1px;background:var(--border);margin:16px 0}
.amt-pos{color:var(--green);font-weight:600}
.amt-neg{color:var(--red);font-weight:600}
.amt-warn{color:var(--amber);font-weight:600}
/* Language switcher */
.lang-switcher{display:flex;align-items:center;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px}
.lang-btn{background:none;border:none;cursor:pointer;padding:4px 7px;border-radius:5px;font-size:15px;transition:background .15s;line-height:1;opacity:.6}
.lang-btn:hover{background:rgba(255,255,255,.08);opacity:1}
.lang-btn.active{background:rgba(124,109,243,.3);opacity:1}
</style>
</head>
<body>
<aside id="sidebar">
  <div class="logo">
    <div class="logo-icon">💼</div>
    <div>
      <div class="logo-text">LocalBiz</div>
      <div class="logo-sub" id="logo-sub">ระบบเอกสารธุรกิจ</div>
    </div>
  </div>
  <nav id="nav">
    <div class="nav-section" data-i18n="nav_sec_main">หลัก</div>
    <a data-page="dashboard" class="active"><span class="icon">🏠</span><span class="nav-label">Dashboard</span></a>
    <a data-page="documents"><span class="icon">📄</span><span class="nav-label">เอกสาร</span></a>
    <a data-page="payments"><span class="icon">💳</span><span class="nav-label">การชำระเงิน</span></a>
    <div class="nav-section" data-i18n="nav_sec_data">ข้อมูล</div>
    <a data-page="contacts"><span class="icon">👥</span><span class="nav-label">ลูกค้า / ผู้ขาย</span></a>
    <a data-page="products"><span class="icon">📦</span><span class="nav-label">สินค้า / บริการ</span></a>
    <div class="nav-section" data-i18n="nav_sec_analyze">วิเคราะห์</div>
    <a data-page="reports"><span class="icon">📈</span><span class="nav-label">รายงาน</span></a>
    <div class="nav-section" style="margin-top:auto"></div>
    <a data-page="companies"><span class="icon">🏢</span><span class="nav-label">บริษัทของฉัน</span></a>
    <a data-page="settings"><span class="icon">⚙️</span><span class="nav-label">ตั้งค่า</span></a>
  </nav>
  <div class="company-switcher" onclick="openCompanySwitcher()" title="">
    <div class="company-switcher-inner">
      <div class="company-avatar" id="co-avatar">บ</div>
      <div class="company-info">
        <div class="company-name" id="co-name">กำลังโหลด...</div>
        <div class="company-sub" id="co-sub">คลิกเพื่อเปลี่ยนบริษัท</div>
      </div>
      <div class="company-caret">▼</div>
    </div>
  </div>
  <div class="sidebar-footer">
    <div class="status-pill">
      <span class="dot off" id="api-dot"></span>
      <span id="api-txt" style="font-size:11px">กำลังเชื่อมต่อ...</span>
    </div>
  </div>
</aside>

<div id="main">
  <div id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="topbar-right">
      <div class="lang-switcher">
        <button class="lang-btn active" data-lang="th" onclick="switchLang('th')" title="ภาษาไทย">🇹🇭</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')" title="English">🇬🇧</button>
        <button class="lang-btn" data-lang="zh" onclick="switchLang('zh')" title="中文">🇨🇳</button>
      </div>
      <div id="topbar-actions"></div>
    </div>
  </div>
  <div id="content">
    <div class="empty-state"><div class="empty-icon">⏳</div><p>กำลังโหลด...</p></div>
  </div>
</div>
<div id="toast"></div>

}

// ── API ───────────────────────────────────────────────────────────────
const API = 'http://localhost:3737/api';
let _modal = null;
async function api(method, path, body) {
  const r = await fetch(API + path, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const GET    = p => api('GET', p);
const POST   = (p,b) => api('POST', p, b);
const PUT    = (p,b) => api('PUT', p, b);
const PATCH  = (p,b) => api('PATCH', p, b);
const DELETE = p => api('DELETE', p);

// ── Toast ─────────────────────────────────────────────────────────────
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `t-item ${type}`;
  el.innerHTML = `<span>${type==='ok'?'✓':'✕'}</span> ${msg}`;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2800);
}

// ── Format ────────────────────────────────────────────────────────────
const fmt      = n => new Intl.NumberFormat('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n||0);
const fmtShort = n => n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':fmt(n);
const fmtDate  = d => d ? d.slice(0,10) : '—';
const SL = () => ({draft:t('status_draft'),sent:t('status_sent'),approved:t('status_approved'),paid:t('status_paid'),cancelled:t('status_cancelled')});
const TL = () => ({quotation:t('type_quotation'),invoice:t('type_invoice'),receipt:t('type_receipt'),billing_note:t('type_billing_note'),cash_invoice:t('type_cash_invoice'),purchase_order:t('type_purchase_order'),expense:t('type_expense')});

// ── Modal ─────────────────────────────────────────────────────────────
function openModal({title,body,footer}) {
  closeModal();
  _modal = document.createElement('div');
  _modal.className = 'overlay';
  _modal.innerHTML = `<div class="modal"><div class="modal-header"><h2>${title}</h2><button class="btn btn-ghost btn-sm btn-icon" onclick="closeModal()">✕</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-footer">${footer}</div>`:''}</div>`;
  _modal.addEventListener('click', e => { if (e.target===_modal) closeModal(); });
  document.body.appendChild(_modal);
}
function closeModal() { if (_modal) { _modal.remove(); _modal=null; } }

  toast(t('toast_update_status')); closeModal(); loadDocs();
}
let _items = [];
async function openDocModal(existing) {
  const {data:contacts=[]} = await GET('/contacts');
  _items = existing?.items?.length ? [...existing.items] : [{description:'',qty:1,unit:'',price:0,discount:0,amount:0}];
  const tl = TL();
  openModal({
    title: existing ? t('modal_edit_doc') : t('modal_new_doc'),
    body:`<div class="form-row">
      <div class="form-group"><label>${t('lbl_doc_type')}</label><select id="f-type">${Object.entries(tl).map(([k,v])=>`<option value="${k}" ${existing?.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="form-group"><label>${t('lbl_doc_number')}</label><input id="f-number" value="${existing?.number||''}" placeholder="${t('lbl_auto_number')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>${t('lbl_contact_select')}</label><select id="f-contact"><option value="">${t('lbl_select')}</option>${contacts.map(c=>`<option value="${c.id}" ${existing?.contact_id==c.id?'selected':''}>${c.name}</option>`).join('')}</select></div>
      <div class="form-group"><label>${t('lbl_contact_name')}</label><input id="f-cname" value="${existing?.contact_name||''}" placeholder="${t('lbl_name_ph')}"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>${t('lbl_date')}</label><input id="f-date" type="date" value="${existing?.date?.slice(0,10)||new Date().toISOString().slice(0,10)}"></div>
      <div class="form-group"><label>${t('lbl_due_date')}</label><input id="f-due" type="date" value="${existing?.due_date?.slice(0,10)||''}"></div>
    </div>
    <div class="divider"></div>
    <div class="item-row-head"><span>${t('lbl_items_col')}</span><span>${t('lbl_qty')}</span><span>${t('lbl_unit')}</span><span>${t('lbl_price_per')}</span><span style="text-align:right">${t('lbl_total_col')}</span><span></span></div>
    <div class="items-list" id="items-container"></div>
    <button type="button" class="btn btn-ghost btn-sm" onclick="addItem()" style="margin-top:10px">${t('btn_add_item')}</button>
    <div class="divider"></div>
    <div class="form-row">
      <div class="form-group"><label>${t('lbl_discount')}</label><input id="f-disc" type="number" value="${existing?.discount||0}" oninput="recalc()"></div>
      <div class="form-group"><label>${t('lbl_vat')}</label><input id="f-vat" type="number" value="${existing?.vat||0}" oninput="recalc()"></div>
    </div>
    <div class="totals-box">
      <div class="row"><span class="label-t">${t('lbl_subtotal')}</span><span id="t-sub">฿0.00</span></div>
      <div class="row"><span class="label-t">${t('lbl_discount')}</span><span id="t-disc" style="color:var(--red)">-฿0.00</span></div>
      <div class="row"><span class="label-t">VAT</span><span id="t-vat">฿0.00</span></div>
      <div class="row total-row"><span>${t('lbl_grand_total')}</span><span id="t-total" style="color:var(--green)">฿0.00</span></div>
    </div>
    <div class="form-group" style="margin-top:14px"><label>${t('lbl_notes')}</label><textarea id="f-notes">${existing?.notes||''}</textarea></div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="saveDoc(${existing?.id||''})">${t('btn_save')}</button>`
  });
  renderItems(); recalc();
}
function renderItems() {
  const c = document.getElementById('items-container');
  if (!c) return;
  c.innerHTML = _items.map((item,i)=>`<div class="item-row"><input value="${item.description||''}" placeholder="${t('lbl_item_ph')}" oninput="_items[${i}].description=this.value"><input type="number" value="${item.qty||1}" min="0" oninput="_items[${i}].qty=+this.value;_items[${i}].amount=(+this.value)*(_items[${i}].price||0);renderItems();recalc()"><input value="${item.unit||''}" placeholder="${t('lbl_unit_ph')}" oninput="_items[${i}].unit=this.value"><input type="number" value="${item.price||0}" min="0" oninput="_items[${i}].price=+this.value;_items[${i}].amount=(_items[${i}].qty||1)*(+this.value);renderItems();recalc()"><span class="item-amount">฿${fmt(item.amount||0)}</span><button class="btn btn-danger btn-sm btn-icon" onclick="_items.splice(${i},1);renderItems();recalc()">✕</button></div>`).join('');
}
function addItem() { _items.push({description:'',qty:1,unit:'',price:0,discount:0,amount:0}); renderItems(); recalc(); }
function recalc() {
  const sub=_items.reduce((s,i)=>s+(i.amount||0),0);
  const disc=+(document.getElementById('f-disc')?.value||0);
  const vat=+(document.getElementById('f-vat')?.value||0);
  const total=sub-disc+vat;
  const q=id=>document.getElementById(id);
  if(q('t-sub'))q('t-sub').textContent='฿'+fmt(sub);
  if(q('t-disc'))q('t-disc').textContent='-฿'+fmt(disc);
  if(q('t-vat'))q('t-vat').textContent='฿'+fmt(vat);
  if(q('t-total'))q('t-total').textContent='฿'+fmt(total);
}
async function saveDoc(id) {
  try {
    const sub=_items.reduce((s,i)=>s+(i.amount||0),0);
    const disc=+(document.getElementById('f-disc').value||0);
    const vat=+(document.getElementById('f-vat').value||0);
    const payload={type:document.getElementById('f-type').value,number:document.getElementById('f-number').value||undefined,contact_id:document.getElementById('f-contact').value?+document.getElementById('f-contact').value:null,contact_name:document.getElementById('f-cname').value||null,date:document.getElementById('f-date').value,due_date:document.getElementById('f-due').value||null,subtotal:sub,discount:disc,vat,total:sub-disc+vat,notes:document.getElementById('f-notes').value||null,items:_items};
    if(id){await PUT('/documents/'+id,payload);toast(t('toast_doc_edited'));}
    else{await POST('/documents',payload);toast(t('toast_doc_saved'));}
    closeModal(); loadDocs();
  } catch(e){toast(e.message,'err');}
}
async function editDoc(id) { const doc=await GET('/documents/'+id); _items=doc.items||[]; openDocModal(doc); }
async function deleteDoc(id) {
  if(!confirm(t('confirm_delete_doc'))) return;
  await DELETE('/documents/'+id); toast(t('toast_doc_deleted')); loadDocs();
}

              ${!c.tax_id&&!c.phone&&!c.email?`<span style="font-size:12px;color:var(--muted2)">${t('no_extra_info')}</span>`:''}

function openCompanyModal(c) {
  c = typeof c==='string'?JSON.parse(c):c;
  openModal({
    title: c?t('modal_edit_company'):t('modal_new_company'),
    body:`
      <div class="form-group">

      <div class="form-row">

        <div class="form-group"><label>${t('lbl_company_branch')}</label><input id="cm-branch" value="${c?.branch||''}" placeholder="${t('lbl_branch_ph')}"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>${t('lbl_company_phone')}</label><input id="cm-phone" value="${c?.phone||''}"></div>

      </div>
      <div class="form-group"><label>${t('lbl_company_website')}</label><input id="cm-web" value="${c?.website||''}" placeholder="https://"></div>
      <div class="form-group"><label>${t('lbl_company_address')}</label><textarea id="cm-addr">${c?.address||''}</textarea></div>
      <div class="form-group"><label>${t('lbl_company_note')}</label><textarea id="cm-note">${c?.note||''}</textarea></div>`,
    footer:`<button class="btn btn-ghost" onclick="closeModal()">${t('btn_cancel')}</button><button class="btn btn-primary" onclick="saveCompany(${c?.id||''})">${t('btn_save')}</button>`
  });
}
function previewLogo(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size>2*1024*1024){toast(t('toast_logo_too_large'),'err');return;}
  const reader = new FileReader();
  reader.onload = e => {
    const data = e.target.result;
    document.getElementById('cm-logo-data').value = data;
    document.getElementById('cm-logo-preview').innerHTML = `<img src="${data}" style="width:100%;height:100%;object-fit:contain">`;
  };
  reader.readAsDataURL(file);
}
function clearLogo() {
  document.getElementById('cm-logo-data').value='';
  document.getElementById('cm-logo-preview').innerHTML=`<span style="font-size:24px;color:var(--muted2)">🏢</span>`;
}
async function saveCompany(id) {
  try {
    const logoData = document.getElementById('cm-logo-data')?.value||null;
    const payload={name:document.getElementById('cm-name').value,tax_id:document.getElementById('cm-tax').value||null,branch:document.getElementById('cm-branch').value||null,phone:document.getElementById('cm-phone').value||null,email:document.getElementById('cm-email').value||null,website:document.getElementById('cm-web').value||null,address:document.getElementById('cm-addr').value||null,note:document.getElementById('cm-note').value||null,logo_url:logoData};
    if(id){await PUT('/companies/'+id,payload);toast(t('toast_company_edited'));}
    else{await POST('/companies',payload);toast(t('toast_company_added'));}
    closeModal(); await loadActiveCompany(); loadCompanies();
  } catch(e){toast(e.message,'err');}
}
async function activateCompany(id) {
  await POST('/companies/'+id+'/activate');
  await loadActiveCompany();
  toast(t('toast_company_changed')+_activeCompany?.name);
  loadCompanies();
}
async function deleteCompany(id) {
  if(!confirm(t('confirm_delete_company'))) return;
  await DELETE('/companies/'+id);
  await loadActiveCompany();
  toast(t('toast_company_deleted'));
  loadCompanies();
}

// Apply saved language on load
_lang = localStorage.getItem('lang') || 'th';
document.documentElement.lang = _lang==='zh'?'zh-CN':_lang;
document.body.className = _lang==='zh'?'lang-zh':'';
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang===_lang));
translateStatic();

checkStatus();
loadActiveCompany();
setInterval(checkStatus, 10000);
navigate('dashboard');
</script>
</body>
</html>
